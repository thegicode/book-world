<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>도서관 검색 (키워드) | Book World</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <link
            rel="shortcut icon"
            href="/assets/images/favicon.ico"
            type="image/x-icon"
        />
        <link
            rel="icon"
            href="/assets/images/favicon.ico"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="/css/library-search-keyword.css" />
        <script type="module" src="/js/library-search-keyword/index.js" async></script>
    </head>
    <body>
        <div class="root">
            <nav-gnb></nav-gnb>
            <app-library-search-keyword>
                <library-search-stored>
                    <h3 class="title">저장된 관심 도서관</h3>
                    <ul class="libries"></ul>
                    <template id="tp-stored-item">
                        <li>
                            <a href="#" class="name"></a>
                            <button type="button" class="cancelButton">
                                해제
                            </button>
                        </li>
                    </template>
                </library-search-stored>

                <div class="search-header">
                    <form class="search-form">
                        <input type="text" name="keyword" placeholder="도서관 이름을 입력하세요" required />
                        <button type="submit">검색</button>
                    </form>
                </div>

                <div class="library-body">
                    <div class="library-list" data-list-container></div>
                    <loading-component>Loading...</loading-component>
                </div>
            </app-library-search-keyword>
        </div>

        <template id="tp-notFound">
            <div class="notFound">데이터가 없습니다.</div>
        </template>
    </body>
</html>
