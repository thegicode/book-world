<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>도서관 조회 | Book World</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <link
            rel="shortcut icon"
            href="/assets/images/favicon.ico"
            type="image/x-icon"
        />
        <link
            rel="icon"
            href="/assets/images/favicon.ico"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="/css/library.css" />
        <script type="module" src="/js/library/index.js" async></script>
    </head>
    <body>
        <div class="root">
            <nav-gnb></nav-gnb>
            <app-library>
                <library-stored>
                    <h3 class="title">저장된 관심 도서관</h3>
                    <ul class="libries"></ul>
                    <template id="tp-stored-item">
                        <li>
                            <span class="name"></span>
                            <button type="button" class="cancelButton">
                                해제
                            </button>
                        </li>
                    </template>
                </library-stored>

                <library-header>
                    <div class="region"></div>
                    <select class="detailRegion"></select>
                </library-header>

                <form class="library-body">
                    <div class="library-list" data-list-container></div>
                    <loading-component>Loading...</loading-component>
                </form>
            </app-library>
        </div>

        <template id="tp-region">
            <label>
                <input type="radio" name="region" value="" />
                <span></span>
            </label>
        </template>

        <template id="tp-notFound">
            <div class="notFound">데이터가 없습니다.</div>
        </template>
    </body>
</html>
