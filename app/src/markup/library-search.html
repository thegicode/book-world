<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>도서관 검색 (키워드) | Book World</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <link
            rel="shortcut icon"
            href="/assets/images/favicon.ico"
            type="image/x-icon"
        />
        <link
            rel="icon"
            href="/assets/images/favicon.ico"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="/css/library-search.css" />
        <script type="module" src="/js/library-search/index.js" async></script>
    </head>
    <body>
        <div class="root">
            <header>
                <nav-gnb></nav-gnb>
            </header>
            <main id="main-content">
                <h1 class="visually-hidden">도서관 검색</h1>
                <page-library-search>
                    <section class="stored-libraries" aria-label="저장된 관심 도서관">
                        <library-search-stored>
                            <h2 class="title">저장된 관심 도서관</h2>
                            <ul class="libries"></ul>
                            <template id="tp-stored-item">
                                <li>
                                    <a href="#" class="name"></a>
                                    <button type="button" class="cancelButton" aria-label="관심 도서관 해제">
                                        해제
                                    </button>
                                </li>
                            </template>
                        </library-search-stored>
                    </section>

                    <section class="search-area" aria-label="도서관 검색 영역">
                        <div class="search-header">
                            <form class="search-form" role="search">
                                <label for="library-keyword" class="visually-hidden">도서관 이름</label>
                                <input type="text" id="library-keyword" name="keyword" placeholder="도서관 이름을 입력하세요" required />
                                <button type="submit">검색</button>
                            </form>
                        </div>
                    </section>

                    <section class="results-area" aria-live="polite" aria-label="검색 결과">
                        <div class="library-body">
                            <library-search-list></library-search-list>
                            <loading-component>Loading...</loading-component>
                        </div>
                    </section>
                </page-library-search>
            </main>
        </div>

        <template id="tp-notFound">
            <div class="notFound" role="status">데이터가 없습니다.</div>
        </template>
        <template id="tp-error">
            <div class="notFound" role="alert">검색 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</div>
        </template>
        <template id="tp-library-search-item">
            <h3 class="libName"></h3>
            <ul>
                <li>
                    <span>도서관 코드 : </span><span class="libCode"></span>
                </li>
                <li><span>주소 : </span><span class="address"></span></li>
                <li><span>전화번호 : </span><span class="tel"></span></li>
                <li><span>팩스 : </span><span class="fax"></span></li>
                <li>
                    <span>홈페이지 : </span>
                    <a class="homepage" href="" target="_blank" rel="noopener noreferrer"></a>
                </li>
                <li><span>휴관일 : </span><span class="closed"></span></li>
                <li>
                    <span>운영시간 : </span><span class="operatingTime"></span>
                </li>
                <li>
                    <span>단행본수 : </span><span class="BookCount"></span>
                </li>
            </ul>
            <div class="actions">
                <label class="my-library-label">
                    <input type="checkbox" name="myLibrary" />
                    <span>관심 도서관</span>
                </label>
            </div>
        </template>
    </body>
</html>
